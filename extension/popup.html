<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 380px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #0f172a; color: #fff; }

    .header { padding: 14px 16px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
    .logo-icon { width: 28px; height: 28px; background: #4175F5; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .status-badge { font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; letter-spacing: 0.03em; }
    .status-idle { background: #1e293b; color: #64748b; }
    .status-recording { background: #dc2626; color: #fff; animation: pulse 1.5s infinite; }
    .status-saving { background: #d97706; color: #fff; }
    .status-saved { background: #059669; color: #fff; }

    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

    .recording-bar { display: none; padding: 10px 16px; background: #dc2626; font-size: 12px; align-items: center; gap: 8px; }
    .recording-bar.active { display: flex; }
    .rec-dot { width: 8px; height: 8px; background: #fff; border-radius: 50%; animation: pulse 1.5s infinite; flex-shrink: 0; }
    .recording-bar span { flex: 1; }
    .rec-time { font-family: 'Courier New', monospace; font-size: 12px; font-weight: 700; }

    .selected-section { padding: 10px 16px; border-bottom: 1px solid #1e293b; }
    .section-label { font-size: 11px; color: #475569; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .selected-chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; align-items: center; }
    .chip { display: flex; align-items: center; gap: 5px; padding: 3px 8px 3px 10px; background: #1e293b; border-radius: 16px; font-size: 11px; color: #cbd5e1; border: 1px solid #334155; }
    .chip-favicon { width: 12px; height: 12px; border-radius: 2px; }
    .chip-name { max-width: 100px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chip-remove { width: 14px; height: 14px; border-radius: 50%; background: #334155; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; color: #94a3b8; line-height: 1; transition: all 0.15s; }
    .chip-remove:hover { background: #dc2626; color: #fff; }
    .chip-empty { color: #475569; font-size: 12px; }

    /* Hint */
    .hint { padding: 8px 16px; font-size: 11px; color: #475569; background: #0c1222; border-bottom: 1px solid #1e293b; display: flex; align-items: center; gap: 6px; }
    .hint-icon { font-size: 13px; }

    .tab-list { max-height: 340px; overflow-y: auto; padding: 6px 8px; }
    .tab-list::-webkit-scrollbar { width: 4px; }
    .tab-list::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 2px; }
    .tab-list::-webkit-scrollbar-track { background: transparent; }

    .tab-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; cursor: pointer; transition: background 0.12s; border: 1px solid transparent; position: relative; }
    .tab-item:hover { background: #1e293b; }
    .tab-item.selected { background: #1e3a5f; border-color: #3b82f6; }
    .tab-item.recording { background: #1f0f0f; border-color: #ef4444; }

    .tab-favicon { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; object-fit: contain; background: #1e293b; }

    .tab-info { flex: 1; min-width: 0; }
    .tab-title { font-size: 12px; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tab-url { font-size: 10px; color: #475569; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

    .tab-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #334155; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; transition: all 0.12s; font-weight: 700; }
    .tab-item.selected .tab-check { background: #3b82f6; border-color: #3b82f6; }
    .tab-empty-check { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #334155; flex-shrink: 0; }

    /* Error banner */
    .error-banner { display: none; margin: 8px; padding: 8px 12px; background: #7f1d1d; border-radius: 8px; font-size: 11px; color: #fca5a5; }
    .error-banner.active { display: block; }

    /* Controls */
    .controls { padding: 10px 16px; border-top: 1px solid #1e293b; display: flex; gap: 8px; }
    .btn { flex: 1; padding: 9px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #2563eb; }
    .btn-danger { background: #dc2626; color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #b91c1c; }
    .btn-secondary { background: #1e293b; color: #94a3b8; }
    .btn-secondary:hover:not(:disabled) { background: #334155; color: #e2e8f0; }

    /* Loading */
    .loading { display: flex; align-items: center; justify-content: center; padding: 40px; gap: 8px; color: #475569; font-size: 12px; }
    .spinner { width: 16px; height: 16px; border: 2px solid #1e293b; border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Success */
    .success-panel { display: none; padding: 20px 16px; text-align: center; }
    .success-panel.active { display: block; }
    .success-icon { font-size: 36px; margin-bottom: 6px; }
    .success-title { font-size: 15px; font-weight: 700; color: #e2e8f0; margin-bottom: 4px; }
    .success-sub { font-size: 12px; color: #475569; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">
      <div class="logo-icon">🎙</div>
      <span>ScreenApp Recorder</span>
    </div>
    <span id="statusBadge" class="status-badge status-idle">Idle</span>
  </div>

  <div id="recordingBar" class="recording-bar">
    <div class="rec-dot"></div>
    <span>Recording <span id="recTabCount">0</span> tabs</span>
    <span id="recTimer" class="rec-time">00:00</span>
  </div>

  <div class="selected-section">
    <div class="section-label">Selected — <span id="selectedCount">0</span> tab(s)</div>
    <div id="selectedChips" class="selected-chips">
      <span class="chip-empty">👆 Click on a tab below to select it</span>
    </div>
  </div>

  <div class="hint">
    <span class="hint-icon">💡</span>
    <span>Click any tab to select it for recording. Select multiple tabs to capture audio from all at once.</span>
  </div>

  <div class="tab-list">
    <div id="tabList">
      <div class="loading"><div class="spinner"></div>Loading tabs...</div>
    </div>
  </div>

  <div id="errorBanner" class="error-banner" style="margin: 8px 16px;"></div>

  <div class="controls">
    <button id="btnCancel" class="btn btn-secondary" onclick="clearSelection()">Clear</button>
    <button id="btnStop" class="btn btn-danger" style="display:none" onclick="stopRecording()">⏹ Stop</button>
    <button id="btnRecord" class="btn btn-primary" onclick="startRecording()" disabled>🎤 Record</button>
  </div>

  <div id="successPanel" class="success-panel">
    <div class="success-icon">✅</div>
    <div class="success-title">Recording saved!</div>
    <div class="success-sub">Open localhost:3000 to transcribe</div>
  </div>

<script src="popup.js"></script>
</body>
</html>
